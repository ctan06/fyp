- name: Apply router configuration
  hosts: cisco_routers
  gather_facts: no

  tasks:

    # HOSTNAME
    - name: Set hostname
      ios_config:
        lines:
          - "hostname {{ hostname }}"
      when: hostname is defined and hostname | length > 0

    # INTERFACES
    - name: Configure interfaces
      ios_config:
        parents: "interface {{ item.name }}"
        lines:
          - "no shutdown"
          - "ip address {{ item.ip }} {{ item.mask }}"
      loop: "{{ interfaces | default([]) }}"
      when:
        - item.name is defined
        - item.ip is defined
        - item.mask is defined
        - item.ip != ""

    # SAVE CONFIG
    - name: Save configuration
      ios_command:
        commands:
          - write memory