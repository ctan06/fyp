---

- name: Displaying Router Configurations
  hosts: cisco_routers
  gather_facts: false

  tasks:
    - name: Get running configuration
      ios_command:
        commands:
          - show running-config
      register: running_config

    - name: Build structured router output
      set_fact:
        router_data:
          name: "{{ inventory_hostname }}"
          ip: "{{ ansible_host }}"
          config: "{{ running_config.stdout[0] }}"

    - name: Output router data as JSON
      debug:
        var: router_data